<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisa... Hay Coordenadas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#d6c7a1;font-family:Georgia,serif;overflow:hidden}

#login{position:fixed;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#0a0a0a,#000);z-index:20}
.login-box{border:1px solid rgba(255,0,0,.2);padding:30px;text-align:center;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);border-radius:10px}
#login input{padding:12px;background:black;border:1px solid #444;color:#fff;margin-top:10px}
#msg{margin-top:10px;color:#8b0000;opacity:0;transition:.3s}

#intro{position:fixed;width:100%;height:100%;background:black;display:none;align-items:center;justify-content:center;z-index:30;color:#8b0000;font-size:2rem;text-align:center}

#main{display:none;overflow:auto}

.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));grid-auto-rows:200px;gap:15px;padding:20px}
.img-box{position:relative;overflow:hidden;border:1px solid rgba(255,0,0,.2);border-radius:10px;cursor:pointer}
.img-box:nth-child(1){grid-row:span 2}
.img-box:nth-child(4){grid-column:span 2}
.img-box:nth-child(6){grid-row:span 2}
.img-box img{width:100%;height:100%;object-fit:cover;transition:.3s}
.img-box:hover img{transform:scale(1.05);filter:brightness(60%)}
.timestamp{position:absolute;bottom:5px;left:5px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 4px}

.blood{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#8b0000;background:rgba(0,0,0,0.85);opacity:0;pointer-events:none;z-index:50;text-shadow:0 0 20px red}

.modal{position:fixed;width:100%;height:100%;top:0;left:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column}
.modal img{max-width:95%;max-height:85%}

.close-btn{
 position:absolute;
 top:15px;
 right:20px;
 font-size:28px;
 color:white;
 cursor:pointer;
 z-index:60;
}

.coords{
 position:absolute;
 bottom:15px;
 right:20px;
 color:red;
 font-size:28px;
 font-weight:bold;
 text-shadow:0 0 10px red;
}

.blur{filter:blur(10px)}

.locked{
 display:flex;
 align-items:center;
 justify-content:center;
 background:#111;
 color:#777;
 font-size:14px;
 text-align:center;
 padding:20px;
}

</style>
</head>
<body>

<div id="login">
 <div class="login-box">
  <h2>Mira todas, y veras la ultima</h2>
  <input id="user" placeholder="Ingresa tu nombre">
  <div id="msg">…te encontré</div>
 </div>
</div>

<div id="intro">Las imágenes no debían ser vistas...</div>

<div id="main">
<div class="blood" id="bloodText"></div>

<div class="container">
<div class="img-box" onclick="openImg(this,1)"><img src="foto (1).png"><div class="timestamp">La Cueva</div></div>
<div class="img-box" onclick="openImg(this,2)"><img src="foto (2).png"><div class="timestamp">Inicio</div></div>
<div class="img-box" onclick="openImg(this,3)"><img src="foto (3).png"><div class="timestamp">clave: cueva</div></div>
<div class="img-box" onclick="openImg(this,4)"><img src="foto (4).png"><div class="timestamp">Ruido</div></div>
<div class="img-box" onclick="openImg(this,5)"><img src="foto (5).png"><div class="timestamp">En el mar/div></div>
<div class="img-box" onclick="openImg(this,6)"><img src="foto (6).png"><div class="timestamp">mira todas</div></div>
<div class="img-box" onclick="openImg(this,7)"><img src="foto (7).png"><div class="timestamp">veras la ultima</div></div>

<div class="img-box locked" id="locked">Imagen corrupta</div>
</div>
</div>

<div class="modal" id="modal">
<div class="close-btn" onclick="closeImg()">✕</div>
<img id="modalImg">
<div class="coords" id="coords"></div>
</div>

<audio id="sound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b7c1d.mp3" loop></audio>

<script>
const user=document.getElementById('user');
const msg=document.getElementById('msg');
const login=document.getElementById('login');
const intro=document.getElementById('intro');
const main=document.getElementById('main');
const sound=document.getElementById('sound');

let viewed=0;
const total=7;


user.addEventListener('input',()=>{
 if(user.value.length>2){
  msg.style.opacity=1;
  setTimeout(()=>{
   login.style.display='none';
   intro.style.display='flex';
   sound.play();
   setTimeout(()=>{
    intro.style.display='none';
    main.style.display='block';
    document.body.style.overflow='auto';
   },2500);
  },1000);
 }
});

const modal=document.getElementById('modal');
const modalImg=document.getElementById('modalImg');
const coords=document.getElementById('coords');

function openImg(el,index){
 modal.style.display='flex';
 modalImg.src=el.querySelector('img')?.src || '';
 coords.innerText='';
 modalImg.classList.remove('blur');

 if(index && !el.classList.contains('seen')){
  el.classList.add('seen');
  viewed++;
 }

 

 if(index===3){showMessage("¿Revisaste bien?");}

 checkUnlock();
}

function closeImg(){modal.style.display='none'}

function checkUnlock(){
 if(viewed>=total){
  const locked=document.getElementById('locked');
  locked.classList.remove('locked');
  locked.innerHTML='<img src="end.png">';
  locked.onclick=openFinal;
 }
}

function openFinal(){
 modal.style.display='flex';
 modalImg.src='end.png';
 modalImg.classList.add('blur');
 coords.innerText='';

 setTimeout(()=>{
  modalImg.classList.remove('blur');
   coords.innerText='-143 36 1881';
   showMessage('No estás solo...');
 },1200);
}

function showMessage(text){
 const blood=document.getElementById('bloodText');
 blood.innerText=text;
 blood.style.opacity=1;
 setTimeout(()=>blood.style.opacity=0,2000);
}

setInterval(()=>{
 showMessage(['ALGO NOS OBSERVA','NO PARPADEES','SIGUE BUSCANDO'][Math.floor(Math.random()*3)]);
},8000);
</script>

</body>
</html>
